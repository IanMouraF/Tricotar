<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cantinho da Lilly 💕</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fff0f5;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; margin: 0;
            color: #4a4a4a;
        }
        .card {
            background: white; padding: 35px 25px; border-radius: 20px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.06); text-align: center;
            border-top: 8px solid #ffb6c1; width: 90%; max-width: 320px;
        }
        .card h2 { color: #db7093; margin-top: 0; }
        input {
            width: 100%; padding: 12px; margin: 10px 0;
            border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box;
            font-size: 1em; text-align: center;
        }
        input:focus { outline: none; border-color: #db7093; }
        button {
            background: #db7093; color: white; border: none;
            padding: 12px; width: 100%; border-radius: 8px;
            font-weight: bold; font-size: 1.05em; cursor: pointer;
            transition: background 0.2s; margin-top: 10px;
        }
        button:hover { background: #c75b7e; }
        .erro { 
            background: #f8d7da; color: #721c24; padding: 10px; 
            border-radius: 8px; font-size: 0.85em; margin-bottom: 10px; 
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>🧶 Oi, Lilly!</h2>
        <p>Entre no seu cantinho especial:</p>
        
        {% if erro %}
        <div class="erro">{{ erro }}</div>
        {% endif %}
        
        <form method="POST">
            <input type="text" name="usuario" placeholder="Seu usuário..." required autofocus>
            <input type="password" name="senha" placeholder="Sua senha mágica..." required>
            <button type="submit">Entrar no Baú</button>
        </form>
    </div>
</body>
</html>
